<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="DejaVu Sans Mono, monospace">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a97ad"/></marker></defs>
<rect width="1180" height="620" rx="14" fill="#0e1526" stroke="#2b3a55" stroke-width="2"/>
<text x="590.0" y="42" fill="#4ec9b0" font-size="22" font-weight="bold" text-anchor="middle">Hva en container egentlig er</text>
<rect x="90" y="470" width="1000" height="90" rx="8" fill="#10203a" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="590.0" y="520.3" fill="#e6e6e6" font-size="16" font-weight="bold" text-anchor="middle"></text>
<text x="590.0" y="522" fill="#569cd6" font-size="18" font-weight="bold" text-anchor="middle">Den delte Linux-kjernen  (én kjerne – alle containere deler den)</text>
<rect x="340" y="130" width="500" height="300" rx="12" fill="#152036" stroke="#4ec9b0" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="590.0" y="160" fill="#4ec9b0" font-size="16" text-anchor="middle">container</text>
<rect x="460" y="220" width="260" height="90" rx="8" fill="#243f22" stroke="#4ec9b0" stroke-width="1.6"/>
<text x="590.0" y="260.2" fill="#e6e6e6" font-size="17" font-weight="bold" text-anchor="middle">din prosess</text>
<text x="590.0" y="281.2" fill="#e6e6e6" font-size="17" font-weight="bold" text-anchor="middle">(PID 1 i containeren)</text>
<rect x="70" y="150" width="230" height="200" rx="8" fill="#1e3550" stroke="#4a90d9" stroke-width="1.6"/>
<text x="185.0" y="255.3" fill="#e6e6e6" font-size="16" font-weight="bold" text-anchor="middle"></text>
<text x="185" y="180" fill="#569cd6" font-size="16" font-weight="bold" text-anchor="middle">namespaces</text>
<text x="90" y="215" fill="#e6e6e6" font-size="14">• pid – egne PID-er</text>
<text x="90" y="245" fill="#e6e6e6" font-size="14">• net – eget nettverk</text>
<text x="90" y="275" fill="#e6e6e6" font-size="14">• mnt – eget filtre</text>
<text x="90" y="305" fill="#e6e6e6" font-size="14">• uts – eget vertsnavn</text>
<text x="90" y="335" fill="#e6e6e6" font-size="14">• ipc · user</text>
<text x="185" y="372" fill="#8a97ad" font-size="13" text-anchor="middle" font-style="italic">ISOLASJON: hva prosessen SER</text>
<rect x="880" y="150" width="230" height="200" rx="8" fill="#243a24" stroke="#4e7a3a" stroke-width="1.6"/>
<text x="995.0" y="255.3" fill="#e6e6e6" font-size="16" font-weight="bold" text-anchor="middle"></text>
<text x="995" y="180" fill="#7cc47c" font-size="16" font-weight="bold" text-anchor="middle">cgroups</text>
<text x="900" y="220" fill="#e6e6e6" font-size="14">• CPU-kvote</text>
<text x="900" y="252" fill="#e6e6e6" font-size="14">• minnegrense</text>
<text x="900" y="284" fill="#e6e6e6" font-size="14">• I/O-vekt</text>
<text x="900" y="316" fill="#e6e6e6" font-size="14">• regnskap/måling</text>
<text x="995" y="372" fill="#8a97ad" font-size="13" text-anchor="middle" font-style="italic">GRENSER: hva den FÅR bruke</text>
<line x1="300" y1="250" x2="458" y2="250" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="880" y1="250" x2="842" y2="250" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="880" y1="250" x2="843" y2="250" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="590.0" y1="430" x2="590.0" y2="468" stroke="#8a97ad" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="590.0" y="602" fill="#dcdcaa" font-size="15" text-anchor="middle">Container = prosess + namespaces (isolasjon) + cgroups (grenser). Ingen egen kjerne.</text>
</svg>
